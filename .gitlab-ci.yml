stages:
  - check
  - monitor

default:
  interruptible: true

variables:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    warn-dirty = false
  GIT_DEPTH: 20

# 1. Détection des secrets (ultra-léger, parallélisé via needs: [])
secret-detection:
  stage: check
  needs: []
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --redact
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

# 2. Linter complet en 1 seule passe Nix (Alejandra + Statix + Deadnix)
nix-lint:
  stage: check
  needs: []
  image: nixos/nix:latest
  cache:
    key: nix-cache-$CI_COMMIT_REF_SLUG
    paths:
      - /root/.cache/nix
  script:
    - nix shell nixpkgs#alejandra nixpkgs#statix nixpkgs#deadnix --command sh -c "alejandra --check . && statix check && deadnix --fail ."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

# 3. Vérification complète du Flake sans double évaluation
nix-eval:
  stage: check
  needs: []
  image: nixos/nix:latest
  cache:
    key: nix-cache-$CI_COMMIT_REF_SLUG
    paths:
      - /root/.cache/nix
  script:
    - nix flake check --no-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

# 4. Monitoring proactif des mises à jour système (uniquement en schedule / web)
monitor-updates:
  stage: monitor
  image: nixos/nix:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - 'CURRENT_SYSTEM=$(nix build .#nixosConfigurations.dellYannis.config.system.build.toplevel --print-out-paths --no-link)'
    - 'nix flake update --commit-lock-file=false'
    - 'UPDATED_SYSTEM=$(nix build .#nixosConfigurations.dellYannis.config.system.build.toplevel --print-out-paths --no-link)'
    - 'nix run nixpkgs#nvd -- diff "$CURRENT_SYSTEM" "$UPDATED_SYSTEM" | tee nvd-update-report.txt'
  artifacts:
    name: "nvd-update-report-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - nvd-update-report.txt
    expire_in: 30 days
